<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מלווה התנסות">
<title>מלווה התנסות קלינית</title>
<style>
:root{
  --paper:#F3F1EC; --card:#FFFFFF; --ink:#23242B; --muted:#6B6D78; --line:#E4E1D8;
  --indigo:#5B67C0; --indigo-soft:#E6E8F6; --indigo-light:#C9CDEB;
  --sage:#6F9A7E; --sage-soft:#E3EEE6;
  --amber:#C98A1B; --amber-soft:#FBF0DA;
  --red:#C2483D; --red-soft:#F8E1DE;
  --radius:14px; --nav-h:64px;
  --font: Rubik, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--indigo)}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:12px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:18px;margin:0;font-weight:700}
header.top .saved{font-size:12px;color:var(--muted);white-space:nowrap}
main{padding:12px 16px calc(var(--nav-h) + 24px);max-width:640px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;gap:2px}
nav.bottom a .ic{font-size:20px;line-height:1}
nav.bottom a.on{color:var(--indigo);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar > span{display:block;height:100%;background:var(--indigo);border-radius:6px}
.bar.sage > span{background:var(--sage)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;width:100%}
.btn.sec{background:var(--card);color:var(--indigo)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--card);border-color:var(--red);color:var(--red)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px;width:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns > .btn{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--indigo-soft);color:var(--indigo)}
.pill.green{background:var(--sage-soft);color:#3F6B4F}
.pill.amber{background:var(--amber-soft);color:#8A5D0E}
.pill.red{background:var(--red-soft);color:var(--red)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--amber-soft);border:1px solid #EBD3A5}
.banner.err{background:var(--red-soft);border:1px solid #EDB9B3}
.banner.info{background:var(--indigo-soft);border:1px solid var(--indigo-light)}
label.f{display:block;margin:10px 0 4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:#fff;cursor:pointer;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--indigo);color:#fff;font-weight:600}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--indigo)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
ol.plain{margin:0;padding-inline-start:22px}
ol.plain li{margin:4px 0}
.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:84px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink)}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
/* attendance */
.att{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.att:last-child{border-bottom:0}
.att .d{font-weight:600}
/* skills */
details.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
details.cat > summary{list-style:none;padding:12px 14px;cursor:pointer}
details.cat > summary::-webkit-details-marker{display:none}
details.cat[open] > summary{border-bottom:1px solid var(--line)}
.skill{padding:10px 14px;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0}
.skill .name{font-size:15px;margin-bottom:6px}
.lv{display:flex;gap:6px}
.lv button{flex:1;min-height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer}
.lv button.on[data-lv=observed]{background:var(--indigo-light);border-color:var(--indigo-light);color:#2E357A;font-weight:600}
.lv button.on[data-lv=guided]{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
.lv button.on[data-lv=supervised]{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.chips button{min-height:36px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px}
.chips button.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.tel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tel:last-child{border-bottom:0}
.tel a.call{white-space:nowrap;text-decoration:none;background:var(--indigo-soft);padding:8px 12px;border-radius:10px;font-weight:600;direction:ltr}
.back{display:inline-block;margin-bottom:10px;text-decoration:none;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:16px 0}
.ltr{direction:ltr;unicode-bidi:isolate}
/* print */
.print-only{display:none}
table.pt{width:100%;border-collapse:collapse;table-layout:fixed;margin:8px 0;font-size:14px}
table.pt th,table.pt td{border:1px solid #999;padding:6px;text-align:center}
table.pt th{background:#eee}
table.pt td.r{text-align:right}
@media print{
  body{background:#fff}
  header.top,nav.bottom,.no-print{display:none !important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .print-only{display:block}
  details.cat{border:0}
}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">מלווה התנסות</h1>

</header>
<main id="app"></main>

</nav>

/* =====================================================================
   STATE + storage
   ===================================================================== */
const STORE_KEY = "clinical.v1";
const PREIMPORT_KEY = "clinical.preimport";
const SCHEMA_VERSION = 1;

function blankState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    student: { name:"", track:"הסבה ט'", ward:"", institution: CONFIG.institution, instructor:"" },
    attendance: [],
    skills: {},
    expectations: {},
    patients: [],
    meta: { created: new Date().toISOString(), lastChange: null, lastFileSave: null }
  };
}

let storageOK = true;
let STATE = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return blankState();
    return migrate(JSON.parse(raw));
  }catch(e){
    console.error("load failed", e);
    storageOK = false;
    return blankState();
  }
}
function migrate(s){
  // schemaVersion 1 is the first version; future migrations go here.
  const b = blankState();
  const out = Object.assign(b, s);
  out.student = Object.assign(blankState().student, s.student||{});
  out.meta = Object.assign(blankState().meta, s.meta||{});
  out.attendance = Array.isArray(s.attendance) ? s.attendance : [];
  out.skills = s.skills && typeof s.skills==="object" ? s.skills : {};
  out.expectations = s.expectations && typeof s.expectations==="object" ? s.expectations : {};
  out.schemaVersion = SCHEMA_VERSION;
  return out;
}
let saveTimer = null;
function commit(){
  STATE.meta.lastChange = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 300);
}
function persist(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
    storageOK = true;
  }catch(e){
    console.error("save failed", e);
    storageOK = false;
  }
  renderSaved();
}

/* =====================================================================
   Utils
   ===================================================================== */
const $ = s => document.querySelector(s);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtDate(s){ if(!s) return ""; const [y,m,d]=s.split("-"); return d+"."+m+"."+y.slice(2); }
function dayName(s){ return ["א'","ב'","ג'","ד'","ה'","ו'","ש'"][parseISO(s).getDay()]; }
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function pct(a,b){ return b? Math.min(100, Math.round(a/b*100)) : 0; }
function num(n){ return (Math.round(n*10)/10).toString(); }
function skillKey(catKey, label){ return catKey+"|"+label; }
function ago(iso){
  if(!iso) return "";
  const m = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(m<1) return "נשמר עכשיו";
  if(m<60) return "נשמר לפני "+m+" דק'";
  const h=Math.floor(m/60); if(h<24) return "נשמר לפני "+h+" ש'";
  return "נשמר לפני "+Math.floor(h/24)+" ימים";
}

/* =====================================================================
   Derived numbers
   ===================================================================== */
function stats(){
  const att = STATE.attendance;
  let field=0, sim=0, absentDays=0, absentHours=0, makeups=0, daysDone=new Set();
  const missingDocs=[];
  att.forEach(a=>{
    const h = Number(a.hours)||0;
    if(a.status==="present"||a.status==="makeup"){
      if(a.type==="sim") sim+=h; else field+=h;
      daysDone.add(a.date+a.type);
      if(a.status==="makeup") makeups++;
    } else if(a.status==="absent"){
      absentDays++; absentHours+= h||CONFIG.hours.perDay;
      if(!a.absenceDocProvided) missingDocs.push(a);
    }
  });
  const limitHours = CONFIG.hours.total*CONFIG.absence.limitPct;
  return { field, sim, total: field+sim, absentDays, absentHours, makeups, days: daysDone.size, missingDocs, limitHours };
}
function practicumPhase(dateISO){
  const {start,end} = CONFIG.dates;
  if(dateISO < start) return { state:"before", week:0 };
  if(dateISO > end) return { state:"after", week: Math.ceil((daysBetween(start,end)+1)/7) };
  return { state:"during", week: Math.floor(daysBetween(start,dateISO)/7)+1 };
}
function absenceLevel(days){
  if(days>=CONFIG.absence.redFromDays) return "red";
  if(days>=CONFIG.absence.yellowFromDays) return "amber";
  return "green";
}
function skillStats(cat){
  let done=0, sup=0;
  cat.items.forEach(l=>{ const s=STATE.skills[skillKey(cat.key,l)]; if(s&&s.level){ done++; if(s.level==="supervised") sup++; } });
  return { done, sup, total: cat.items.length };
}
function allSkillStats(){
  let done=0,total=0; CONFIG.skillCats.forEach(c=>{const s=skillStats(c); done+=s.done; total+=s.total;}); return {done,total};
}

function banners(){
  let h="";
  if(!storageOK) h+=`<div class="banner err">הדפדפן לא מאפשר שמירה מקומית כרגע. הנתונים לא יישמרו — שמור/י קובץ גיבוי מ"עוד ← גיבוי".</div>`;
  const s = stats();
  if(s.missingDocs.length) h+=`<div class="banner warn"><b>אחרי היעדרות:</b> להביא אישור היעדרות (${s.missingDocs.map(a=>fmtDate(a.date)).join(", ")}) ולתאם השלמת שעות עם המדריך/ה. <a href="#log">ליומן</a></div>`;
  else if(s.absentDays > s.makeups) h+=`<div class="banner warn">${s.absentDays-s.makeups} ימי היעדרות עדיין ללא השלמה. לתאם עם המדריך/ה.</div>`;
  const last = STATE.meta.lastFileSave;
  const hasData = STATE.attendance.length || Object.keys(STATE.skills).length;
  if(hasData && (!last || (Date.now()-new Date(last).getTime()) > CONFIG.backupReminderDays*86400000)){
    h+=`<div class="banner info">${last? "לא נשמר קובץ גיבוי ב-"+CONFIG.backupReminderDays+" הימים האחרונים." : "עדיין לא נשמר קובץ גיבוי."} <a href="#backup">שמור גיבוי</a></div>`;
  }
  return h;
}

  html += `<div class="card">`;

VIEWS.skills = () => {

    <div class="bar sage"><span style="width:${pct(sk.done,sk.total)}%"></span></div>

  </div>
  <input type="search" id="skillSearch" placeholder="🔍 חיפוש מיומנות" value="${esc(skillQuery)}">
  <div class="chips">
    ${[["all","הכל"],["todo","לא בוצעו עדיין"],["done","סומנו"]].map(([k,l])=>`<button data-act="skillFilter" data-val="${k}" class="${skillFilter===k?"on":""}">${l}</button>`).join("")}
    <a class="btn small sec" href="#print-skills" style="margin-inline-start:auto">הדפסה לחתימה</a>
  </div>
  <div id="skillList">${skillListHTML()}</div>`;
};
function skillListHTML(){
  const q = skillQuery.trim();
  let html="", any=false;
  CONFIG.skillCats.forEach(cat=>{
    const items = cat.items.filter(l=>{
      const st = STATE.skills[skillKey(cat.key,l)];
      if(skillFilter==="todo" && st && st.level) return false;
      if(skillFilter==="done" && !(st && st.level)) return false;
      if(q && !l.includes(q) && !cat.name.includes(q)) return false;
      return true;
    });
    if(!items.length) return;
    any=true;
    const s = skillStats(cat);
    const open = q || openCats.has(cat.key);
    html += `<details class="cat" data-cat="${cat.key}" ${open?"open":""}><summary>
      <div class="row"><b>${esc(cat.name)}</b><span class="small muted">${s.done}/${s.total}</span></div>
      <div class="bar sage" style="height:6px;margin-bottom:0"><span style="width:${pct(s.done,s.total)}%"></span></div></summary>`;
    items.forEach(l=>{
      const k = skillKey(cat.key,l), st = STATE.skills[k]||{};
      html += `<div class="skill"><div class="name">${esc(l)}</div>
        <div class="lv">${CONFIG.skillLevels.map(lv=>`<button data-act="skillLevel" data-key="${esc(k)}" data-lv="${lv.key}" class="${st.level===lv.key?"on":""}">${lv.label}</button>`).join("")}</div>
        ${st.level? `<div class="small muted" style="margin-top:4px">${fmtDate(st.date)}</div>`:""}
      </div>`;
    });
    html += `</details>`;
  });
  if(!any) html = `<div class="empty">אין מיומנויות שמתאימות לסינון.</div>`;
  return html;
}

    if(!FORM.date){ alertMsg("יש לבחור תאריך"); return; }
    const h = Number(FORM.hours);
    if(isNaN(h) || h<0 || h>24){ alertMsg("מספר שעות לא תקין"); return; }
    FORM.hours = h;
    if(FORM.status!=="absent") FORM.absenceDocProvided=false;
    if(FORM.id){ const i=STATE.attendance.findIndex(a=>a.id===FORM.id); STATE.attendance[i]=Object.assign({},FORM); }
    else { FORM.id=uid(); STATE.attendance.push(Object.assign({},FORM)); }
    commit(); location.hash="#log";
  },
  formDelete(){
    if(!confirm("למחוק את הרשומה מ-"+fmtDate(FORM.date)+"?")) return;
    STATE.attendance = STATE.attendance.filter(a=>a.id!==FORM.id);
    commit(); location.hash="#log";
  },
  skillFilter(el){ skillFilter=el.dataset.val; rerenderKeepScroll(); },
  skillLevel(el){
    const k=el.dataset.key, lv=el.dataset.lv, cur=STATE.skills[k];
    if(cur && cur.level===lv) delete STATE.skills[k];
    else STATE.skills[k] = { level: lv, date: todayISO(), note: (cur&&cur.note)||"" };
    commit();
    const y=window.scrollY; $("#app").innerHTML = VIEWS.skills(); window.scrollTo(0,y);
  },
  expToggle(el){
    const i=el.dataset.i;
    if(el.checked) STATE.expectations[i]={date: todayISO()}; else delete STATE.expectations[i];
    commit(); rerenderKeepScroll();
  },
  exportFile(){ exportFile(); },
  importPick(){ $("#fileIn").value=""; $("#fileIn").click(); },
  importConfirm(){ doImport(); },
  importCancel(){ PENDING_IMPORT=null; $("#importPreview").innerHTML=""; },
  wipe(){
    if(!confirm("למחוק את כל הנתונים מהמכשיר?")) return;
    if(!confirm("בטוח? פעולה זו אינה הפיכה (אלא אם שמרת קובץ גיבוי).")) return;
    STATE = blankState(); persist(); location.hash="#home"; render();
  },
  print(){ window.print(); },
  goBack(){ history.length>1 ? history.back() : (location.hash="#home"); }
};
function alertMsg(m){ alert(m); }

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(el.type==="checkbox") return; // handled on change
  e.preventDefault();
  const fn = ACTIONS[el.dataset.act];
  if(fn) fn(el);
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset && el.dataset.act==="expToggle") ACTIONS.expToggle(el);
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="skillSearch"){ skillQuery=el.value; $("#skillList").innerHTML=skillListHTML(); }
  else if(el.id==="expNotes"){ STATE.expectations.notes=el.value; commit(); }
  else if(el.dataset && el.dataset.student){ STATE.student[el.dataset.student]=el.value; commit(); }
});
document.addEventListener("toggle", e=>{
  const d=e.target; if(d.matches && d.matches("details.cat")){ d.open? openCats.add(d.dataset.cat) : openCats.delete(d.dataset.cat); }
}, true);

/* =====================================================================
   Backup file
   ===================================================================== */
async function exportFile(){
  const payload = Object.assign({}, STATE, { exportedAt: new Date().toISOString() });
  const json = JSON.stringify(payload, null, 2);
  const name = "clinical-backup-"+todayISO()+".json";
  const blob = new Blob([json], {type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      await navigator.share({ files:[file], title: name });
      markSaved(); return;
    }
  }catch(err){
    if(err && err.name==="AbortError") return;
    console.error("share failed, falling back to download", err);
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000);
  markSaved();
}
function markSaved(){ STATE.meta.lastFileSave=new Date().toISOString(); commit(); if(route.name==="backup") rerenderKeepScroll(); }

let PENDING_IMPORT=null;
$("#fileIn").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload = ()=>{
    let data;
    try{ data=JSON.parse(r.result); }
    catch(err){ console.error(err); showImportError("הקובץ אינו JSON תקין: "+err.message); return; }
    if(!data || typeof data!=="object" || !("schemaVersion" in data) || !Array.isArray(data.attendance)){ showImportError("הקובץ אינו קובץ גיבוי של המערכת."); return; }
    if(data.schemaVersion > SCHEMA_VERSION){ showImportError("הקובץ נוצר בגרסה חדשה יותר של המערכת (schema "+data.schemaVersion+")."); return; }
    PENDING_IMPORT=data;
    const att=data.attendance.length, sk=Object.values(data.skills||{}).filter(x=>x&&x.level).length;
    const when=data.exportedAt? new Date(data.exportedAt).toLocaleString("he-IL") : "לא ידוע";
    $("#importPreview").innerHTML = `<div class="card"><h2>טעינת גיבוי</h2>
      <ul class="list small"><li>נשמר: <b>${esc(when)}</b></li><li>רשומות יומן: <b>${att}</b></li><li>מיומנויות מסומנות: <b>${sk}</b></li><li>מטופלים: <b>${(data.patients||[]).length}</b></li><li>סטודנט/ית: <b>${esc((data.student&&data.student.name)||"—")}</b></li></ul>
      <div class="banner warn" style="margin-top:8px">הטעינה תחליף את כל הנתונים הנוכחיים. עותק של המצב הנוכחי יישמר במכשיר לפני ההחלפה.</div>
      <div class="btns"><button class="btn" data-act="importConfirm">טען והחלף</button><button class="btn ghost" data-act="importCancel">ביטול</button></div></div>`;
  };
  r.onerror = ()=>{ console.error(r.error); showImportError("קריאת הקובץ נכשלה: "+(r.error&&r.error.message)); };
  r.readAsText(f);
});
function showImportError(m){ $("#importPreview").innerHTML=`<div class="banner err">${esc(m)}</div>`; }
function doImport(){
  if(!PENDING_IMPORT) return;
  try{ localStorage.setItem(PREIMPORT_KEY, JSON.stringify(STATE)); }
  catch(e){ console.error("pre-import copy failed", e); if(!confirm("לא ניתן לשמור עותק של המצב הנוכחי ("+e.message+"). להמשיך בכל זאת?")) return; }
  const d = Object.assign({}, PENDING_IMPORT); delete d.exportedAt;
  STATE = migrate(d); PENDING_IMPORT=null; persist();
  location.hash="#home"; render();
}

/* ---------- boot ---------- */
render();
setInterval(renderSaved, 30000);
</script>
</body>
</html>
